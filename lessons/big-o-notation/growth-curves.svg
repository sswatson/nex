<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" font-family="system-ui, -apple-system, sans-serif" role="img" aria-label="Growth curves: O(1) stays flat, O(log n) flattens out, O(n) rises steadily, O(n squared) rises steeply">
  <style>
    svg {
      --ink: #0b0b0b;
      --ink-2: #52514e;
      --grid: #e4e3df;
      --s1: #2a78d6;
      --s2: #008300;
      --s3: #e87ba4;
      --s4: #eda100;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink: #ffffff;
        --ink-2: #c3c2b7;
        --grid: #33353f;
        --s1: #3987e5;
        --s2: #008300;
        --s3: #d55181;
        --s4: #c98500;
      }
    }
    text { fill: var(--ink-2); font-size: 13px; }
    .label { fill: var(--ink); }
    .curve { fill: none; stroke-width: 2; stroke-linecap: round; }
    .axis { stroke: var(--ink-2); stroke-width: 1; }
    .grid { stroke: var(--grid); stroke-width: 1; }
  </style>

  <!-- legend -->
  <g font-size="12.5">
    <line x1="60" y1="14" x2="80" y2="14" class="curve" stroke="var(--s1)"/>
    <text x="86" y="18">O(1)</text>
    <line x1="140" y1="14" x2="160" y2="14" class="curve" stroke="var(--s2)"/>
    <text x="166" y="18">O(log n)</text>
    <line x1="248" y1="14" x2="268" y2="14" class="curve" stroke="var(--s3)"/>
    <text x="274" y="18">O(n)</text>
    <line x1="330" y1="14" x2="350" y2="14" class="curve" stroke="var(--s4)"/>
    <text x="356" y="18">O(n²)</text>
  </g>

  <!-- grid -->
  <line x1="60" y1="100" x2="430" y2="100" class="grid"/>
  <line x1="60" y1="160" x2="430" y2="160" class="grid"/>
  <line x1="60" y1="220" x2="430" y2="220" class="grid"/>

  <!-- axes -->
  <line x1="60" y1="30" x2="60" y2="280" class="axis"/>
  <line x1="60" y1="280" x2="430" y2="280" class="axis"/>
  <text x="245" y="306" text-anchor="middle">input size n →</text>
  <text x="24" y="155" text-anchor="middle" transform="rotate(-90 24 155)">work →</text>

  <!-- curves -->
  <path class="curve" stroke="var(--s4)" d="M60,280 Q320,264 420,40"/>
  <path class="curve" stroke="var(--s3)" d="M60,280 L420,128"/>
  <path class="curve" stroke="var(--s2)" d="M60,280 C100,196 160,188 420,172"/>
  <path class="curve" stroke="var(--s1)" d="M60,264 L420,264"/>

  <!-- direct labels at line ends -->
  <g class="label" font-size="13">
    <text x="428" y="44">O(n²)</text>
    <text x="428" y="132">O(n)</text>
    <text x="428" y="176">O(log n)</text>
    <text x="428" y="268">O(1)</text>
  </g>
</svg>
